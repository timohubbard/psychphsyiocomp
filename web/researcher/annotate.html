<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Annotate</title>
<style>
  :root {
    --bg: #14171c; --panel: #1b1f26; --border: #2a303a; --fg: #e6e9ee;
    --muted: #8d97a5; --accent: #6aa9ff; --ok: #5fbf7f; --warn: #d9b25a;
    --bad: #d97a76;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; align-items: baseline; gap: 14px; padding: 12px 20px;
    border-bottom: 1px solid var(--border); flex-wrap: wrap;
  }
  h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .sub { color: var(--muted); font-size: 12px; }
  main { max-width: 900px; margin: 0 auto; padding: 20px 16px 80px; }

  .setup { display: grid; gap: 12px; }
  label.field { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
  input, select {
    background: var(--panel); border: 1px solid var(--border); color: var(--fg);
    padding: 7px 10px; border-radius: 6px; font: inherit; font-size: 13px;
  }
  button {
    background: transparent; border: 1px solid var(--border); color: var(--fg);
    padding: 7px 14px; border-radius: 6px; font: inherit; font-size: 13px;
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { border-color: var(--accent); color: var(--accent); }

  .media { background: #000; border-radius: 8px; overflow: hidden;
           aspect-ratio: 16 / 10; display: grid; place-items: center; }
  video { width: 100%; height: 100%; object-fit: contain; }

  .cats { display: grid; gap: 8px; margin: 16px 0; }
  .cat {
    display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; cursor: pointer; text-align: left;
    width: 100%; color: inherit; font: inherit;
  }
  .cat:hover { border-color: var(--accent); }
  .cat.chosen { border-color: var(--ok); }
  .key {
    display: grid; place-items: center; width: 26px; height: 26px;
    border: 1px solid var(--border); border-radius: 5px; font-size: 12px;
    color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .cat.chosen .key { color: var(--ok); border-color: var(--ok); }
  .cat .lbl { font-weight: 600; }
  .cat .desc { color: var(--muted); font-size: 12px; }

  .bar { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); transition: width .2s; }
  .row { display: flex; align-items: center; gap: 12px; justify-content: space-between; }

  .note {
    font-size: 12.5px; color: var(--muted); border-left: 2px solid var(--border);
    padding: 2px 0 2px 12px; margin: 14px 0;
  }
  .note.bad { border-left-color: var(--bad); color: #d9b3b1; }
  .empty { color: var(--muted); padding: 50px 0; text-align: center; }
  code { background: #22262d; padding: 1px 5px; border-radius: 3px; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>Annotate</h1>
  <span class="sub" id="sub">loading…</span>
  <span class="sub" style="margin-left:auto"><a href="/" style="color:var(--accent)">sessions</a></span>
</header>
<main id="main"><div class="empty">loading…</div></main>
<script type="module" src="./annotate.js"></script>
</body>
</html>
