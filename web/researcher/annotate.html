<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Annotate</title>
<link rel="stylesheet" href="./site.css">
<style>
  .sub { color: var(--muted); font-size: 12px; }
  main { max-width: 900px; margin: 0 auto; padding: 24px 16px 80px; }

  .setup { display: grid; gap: 14px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px; }
  label.field { display: grid; gap: 5px; font-size: 12.5px; font-weight: 550; color: #cfd3d8; }
  button { font-size: 13px; padding: 7px 14px; }

  .media { background: #000; border-radius: 8px; overflow: hidden;
           aspect-ratio: 16 / 10; display: grid; place-items: center; }
  video { width: 100%; height: 100%; object-fit: contain; }

  .cats { display: grid; gap: 8px; margin: 16px 0; }
  .cat {
    display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; cursor: pointer; text-align: left;
    width: 100%; color: inherit; font: inherit;
  }
  .cat:hover:not(:disabled) { border-color: var(--accent); background: var(--panel2); }
  .cat.chosen { border-color: var(--ok); }
  .key {
    display: grid; place-items: center; width: 26px; height: 26px;
    border: 1px solid var(--border); border-radius: 5px; font-size: 12px;
    color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .cat.chosen .key { color: var(--ok); border-color: var(--ok); }
  .cat .lbl { font-weight: 600; }
  .cat .desc { color: var(--muted); font-size: 12px; }

  .bar { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); transition: width .2s; }
  .row { display: flex; align-items: center; gap: 12px; justify-content: space-between; }

  .note {
    font-size: 12.5px; color: var(--muted); border-left: 2px solid var(--border);
    padding: 2px 0 2px 12px; margin: 14px 0;
  }
  .note.bad { border-left-color: var(--bad); color: #d9b3b1; }
  .empty { color: var(--muted); padding: 50px 0; text-align: center; }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="./index.html"><i></i>Researcher</a>
  <nav class="pages"><a href="./index.html">Sessions</a><a href="./cohort.html">Cohort</a><a href="./builder.html">Study builder</a><a href="./annotate.html" aria-current="page">Annotate</a></nav>
  <span class="spacer"></span>
  <span class="sub" id="sub">loading…</span>
</header>
<main id="main"><div class="empty">loading…</div></main>
<script type="module" src="./annotate.js"></script>
</body>
</html>
