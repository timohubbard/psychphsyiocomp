<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sessions</title>
<link rel="stylesheet" href="./site.css">
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; }

  main { flex: 1; display: grid; grid-template-columns: 340px minmax(0, 1fr); min-height: 0; }
  #side { border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; background: var(--bg2); }
  .filter { padding: 12px; border-bottom: 1px solid var(--border); }
  .filter input { width: 100%; }
  #list { overflow-y: auto; flex: 1; padding: 6px; }
  #detail { overflow-y: auto; padding: 22px 28px 60px; }
  .detailwrap { max-width: 1240px; }

  /* the list */
  .sess { padding: 10px 12px; border-radius: 9px; cursor: pointer; border: 1px solid transparent; margin-bottom: 2px; }
  .sess:hover { background: var(--panel); }
  .sess.active { background: var(--panel2); border-color: var(--border2); box-shadow: inset 3px 0 0 var(--accent); }
  .sess .id { font-family: var(--mono); font-size: 12.5px; color: var(--fg); }
  .sess .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .sess .pills { margin-top: 7px; display: flex; gap: 4px; flex-wrap: wrap; }
  .sess[hidden] { display: none; }

  /* one session */
  .dhead { display: flex; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  .dhead h1 { margin: 0; font-family: var(--mono); font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
  .dhead .meta { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .dhead .pills { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600;
    margin: 30px 0 12px; padding-top: 18px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
  h2:first-child { margin-top: 0; padding-top: 0; border-top: 0; }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--r); padding: 12px 14px; }
  .card .k { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  .card .v { font-size: 21px; margin-top: 4px; font-family: var(--mono); font-weight: 500; letter-spacing: -.02em; }
  .card .v.txt { font-family: inherit; font-size: 15px; font-weight: 600; letter-spacing: 0; line-height: 1.35; margin-top: 7px; }
  .card .n { color: var(--muted); font-size: 11.5px; margin-top: 4px; }
  .card.ok { box-shadow: inset 0 2px 0 var(--ok); } .card.ok .v { color: var(--ok); }
  .card.warn { box-shadow: inset 0 2px 0 var(--warn); } .card.warn .v { color: var(--warn); }
  .card.bad { box-shadow: inset 0 2px 0 var(--bad); } .card.bad .v { color: var(--bad); }

  #detail td { font-family: var(--mono); font-size: 12px; }
  #detail td.txt { font-family: inherit; font-size: 12.5px; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover td { background: var(--panel); }
  .scroll { max-height: 340px; overflow-y: auto; border: 1px solid var(--border); border-radius: var(--r); }
  .src { color: var(--muted); font-weight: 400; text-transform: none; letter-spacing: 0; margin-left: 6px; }
  svg { display: block; }
  .tier-low { color: var(--warn); } .tier-high { color: var(--ok); }

  .aoi-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 0 0 12px; }
  .aoi-bar select, .aoi-bar input { padding: 5px 9px; font-size: 12.5px; }
  .aoi-bar input { width: 62px; }
  .aoi-bar label, .aoi-bar span { color: var(--muted); font-size: 12px; }

  @media (max-width: 900px) {
    html, body { height: auto; }
    main { display: block; }
    #side { border-right: 0; border-bottom: 1px solid var(--border); }
    #list { max-height: 40vh; }
    #detail { overflow: visible; padding: 18px 16px 40px; }
  }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="./index.html"><i></i>Researcher</a>
  <nav class="pages"><a href="./index.html" aria-current="page">Sessions</a><a href="./cohort.html">Cohort</a><a href="./builder.html">Study builder</a><a href="./codebook.html">Codebooks</a><a href="./annotate.html">Annotate</a><a href="./reliability.html">Reliability</a></nav>
  <span class="spacer"></span>
  <span class="sub" id="sub">loading…</span>
</header>

<main>
  <aside id="side">
    <div class="filter"><input id="filter" type="search" placeholder="Filter by session, study or participant" aria-label="Filter sessions"></div>
    <div id="list"></div>
  </aside>
  <div id="detail"><div class="empty">Select a session</div></div>
</main>

<script type="module" src="./app.js"></script>
</body>
</html>
