<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study builder</title>
<link rel="stylesheet" href="./site.css">
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; }


  /* ---- layout ---- */
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: 220px minmax(0, 1fr) minmax(400px, .9fr); }
  #rail { border-right: 1px solid var(--border); padding: 18px 12px; overflow-y: auto; }
  #form { overflow-y: auto; padding: 18px 28px 120px; scroll-behavior: smooth; }
  #side { overflow-y: auto; border-left: 1px solid var(--border); background: #0d0f12; padding: 18px 22px 80px; }
  .formwrap { max-width: 760px; margin: 0 auto; }

  /* rail */
  .rail-h { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); margin: 0 8px 8px; }
  .step { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: transparent;
    border: 0; border-radius: 8px; padding: 7px 8px; color: var(--muted); font-size: 13px; }
  .step:hover:not(:disabled) { background: var(--panel); border: 0; color: var(--fg); }
  .step.cur { background: var(--panel2); color: var(--fg); }
  .step .n { flex: 0 0 22px; height: 22px; border-radius: 50%; border: 1px solid var(--border2); font-size: 11px;
    display: inline-flex; align-items: center; justify-content: center; color: var(--muted); }
  .step.good .n { border-color: #2d5a42; color: var(--ok); background: #14241c; }
  .step.has .n { border-color: var(--bad); background: var(--bad); color: #fff; font-weight: 700; }
  .rail-foot { margin: 18px 8px 0; padding-top: 14px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); }
  .rail-foot b { color: var(--fg); font-size: 18px; font-weight: 600; display: block; }

  .sub { border: 1px solid var(--border); border-radius: var(--r); padding: 12px 14px 14px; margin-top: 16px; background: #14171c; }
  .sub h4 { margin: 0 0 2px; font-size: 13px; font-weight: 600; }
  .sub > .muted { margin: 0 0 12px; }
  .sub.need { border-color: #5a4a1c; }

  /* choice cards */
  .opts { display: grid; gap: 8px; }
  .opts.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .opt { position: relative; display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--border2);
    border-radius: var(--r); padding: 10px 12px; background: #13161b; cursor: pointer; }
  .opt:hover { border-color: #4a5260; }
  .opt.on { border-color: var(--c, var(--accent)); background: color-mix(in srgb, var(--c, var(--accent)) 9%, #13161b); }
  .opt input[type=checkbox], .opt input[type=radio] { margin: 3px 0 0; flex: 0 0 auto; accent-color: var(--c, var(--accent)); }
  .otxt { flex: 1; min-width: 0; }
  .otxt b { display: block; font-size: 13.5px; font-weight: 600; }
  .otxt small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .swatch { width: 8px; height: 8px; border-radius: 50%; background: var(--c); display: inline-block; margin-right: 7px; vertical-align: 1px; }
  .tag { display: inline-block; font-size: 10.5px; font-weight: 500; color: #e3c27a; border: 1px solid #5a4a1c;
    border-radius: 999px; padding: 0 7px; margin-left: 6px; vertical-align: 1px; }
  .tier { cursor: default; padding: 0; }
  .tier .omain { display: flex; gap: 10px; flex: 1; padding: 10px 12px; cursor: pointer; }
  .def { align-self: center; margin-right: 12px; font-size: 12px; color: var(--muted); display: inline-flex; gap: 6px;
    align-items: center; border: 1px solid var(--border2); border-radius: 999px; padding: 3px 10px 3px 8px; cursor: pointer; white-space: nowrap; }
  .def.is { color: var(--fg); border-color: var(--accent); }
  .inline { display: flex; gap: 8px 16px; align-items: flex-start; flex-wrap: wrap; margin-top: 12px; }
  .inline .toggle { margin-top: 24px; }
  .inline .field { margin: 0; }
  .toggle { display: inline-flex; gap: 8px; align-items: center; font-size: 13px; cursor: pointer; padding: 7px 0; }
  .toggle small { color: var(--muted); }

  /* tasks */
  .tasks { display: grid; gap: 10px; }
  .task { border: 1px solid var(--border2); border-left: 4px solid var(--c, var(--border2)); border-radius: var(--r);
    background: #13161b; scroll-margin: 60px; }
  .thead { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 12px; }
  .tnum { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; width: 16px; }
  .ttl { flex: 1; min-width: 0; }
  .ttl b { font-size: 13.5px; font-weight: 600; }
  .ttl span { display: block; color: var(--muted); font-size: 12px; }
  .tdur { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .tools { display: flex; gap: 2px; }
  .tbody { padding: 2px 14px 14px 38px; }
  .tbody:empty { display: none; }
  .arms { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 10px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border2); border-radius: 999px;
    padding: 2px 10px 2px 7px; font-size: 12px; color: var(--fg); cursor: pointer; }
  .chip.on { border-color: var(--accent); background: #4c8dff1f; }
  .chip input { margin: 0; }
  .task.flash { box-shadow: 0 0 0 2px var(--accent); transition: box-shadow .2s; }
  .empty { border: 1px dashed var(--border2); border-radius: var(--r); padding: 16px; text-align: center; color: var(--muted); font-size: 13px; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; margin-top: 12px; }
  .tile { border: 1px solid var(--border2); border-radius: 9px; overflow: hidden; background: var(--panel); position: relative; }
  .thumb { height: 88px; background: #0b0d10; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 12px; }
  .thumb img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .thumb .play { font-size: 22px; }
  .tile .meta { padding: 7px 8px 8px; display: grid; gap: 6px; }
  .tile .meta > * { min-width: 0; }
  .tile input { padding: 4px 7px; font-size: 12.5px; }
  .tile .kind { font-size: 11px; color: var(--muted); }
  .tile .rm { position: absolute; top: 4px; right: 4px; background: #000a; color: #ddd; }
  .mini { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); white-space: nowrap; }
  .mini input { flex: 1; min-width: 0; width: auto; }
  .drop { border: 1.5px dashed var(--border2); border-radius: 9px; min-height: 150px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 4px; text-align: center; padding: 10px; cursor: pointer; color: var(--muted);
    position: relative; font-size: 12.5px; }
  .drop:hover, .drop.over { border-color: var(--accent); color: var(--fg); background: #4c8dff0f; }
  .drop b { font-size: 20px; font-weight: 400; line-height: 1; }
  .drop input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .drop .up { font-size: 11.5px; }

  /* questions */
  .qlist { display: grid; gap: 10px; margin-top: 12px; }
  .qcard { border: 1px solid var(--border2); border-radius: 9px; background: var(--panel); padding: 8px 12px 10px; }
  .qhead { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .qhead .grow { flex: 1; }
  .qnum { width: 22px; height: 22px; border-radius: 50%; background: var(--panel3); color: var(--muted);
    display: inline-flex; align-items: center; justify-content: center; font-size: 11px; }
  .grid-qid { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 0 12px; }
  .grid4q { display: grid; grid-template-columns: 90px 90px minmax(0, 1fr) minmax(0, 1fr); gap: 0 10px; }
  .qcard .field { margin-bottom: 8px; }
  .opts-edit { display: grid; gap: 6px; margin-bottom: 8px; }
  .orow { display: grid; grid-template-columns: 22px minmax(0, 1fr) 150px 28px; gap: 8px; align-items: center; }
  .orow .field { margin: 0; }
  .orow .lbl { display: none; }
  .okey { font-size: 12px; color: var(--muted); text-align: center; }
  .qadd { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 10px; }
  @media (max-width: 900px) { .grid-qid, .grid4q, .orow { grid-template-columns: minmax(0, 1fr); } }
  .palette { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; margin-top: 14px; }
  .palette-h { font-size: 12px; color: var(--muted); margin: 16px 0 0; }
  .pal { text-align: left; display: flex; gap: 9px; align-items: flex-start; background: transparent; padding: 7px 10px; }
  .pal i { flex: 0 0 8px; height: 8px; border-radius: 50%; background: var(--c); margin-top: 6px; }
  .pal span { display: block; }
  .pal small { display: block; color: var(--muted); font-size: 11.5px; }

  table.rules { width: 100%; border-collapse: collapse; }
  table.rules th { position: static; background: none; border: 0; }
  table.rules td { border: 0; }
  table.rules tr:hover td { background: none; }
  table.rules th { text-align: left; font-size: 11.5px; font-weight: 550; color: var(--muted); padding: 0 6px 5px 0; }
  table.rules td { padding: 0 6px 6px 0; }
  table.rules td:first-child { width: 50%; }
  table.rules td:last-child { width: 30px; padding-right: 0; }
  .rulesh { font-size: 13px; font-weight: 600; margin: 18px 0 2px; }
  .rulesh + .muted { margin: 0 0 10px; }
  .epoch { border: 1px solid var(--border2); border-radius: var(--r); padding: 12px 12px 2px; margin-bottom: 10px; background: #13161b; position: relative; }
  .epoch .rm { position: absolute; top: 6px; right: 6px; }
  .epoch .grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0 10px; }
  .epoch .field { margin-bottom: 10px; }
  .epoch .span2 { grid-column: span 2; }
  .epoch .lbl { font-size: 11.5px; font-weight: 500; color: var(--muted); margin-bottom: 3px; }
  .epoch input { padding: 5px 8px; font-size: 13px; }


  .preview { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; font-size: 13.5px; line-height: 1.55; }
  .preview p { margin: 8px 0; }
  .preview .selftest { background: #2a1716; border: 1px solid #6b2f2d; color: #f0a09d; border-radius: 8px; padding: 8px 10px; margin: 0 0 10px; }
  .preview .tier { border: 1px solid var(--border2); border-radius: 9px; padding: 9px 12px; margin: 8px 0; }
  .preview .tier ul { margin: 4px 0 0; padding-left: 18px; color: var(--muted); font-size: 12.5px; }
  .preview .small { color: var(--muted); font-size: 12.5px; }
  .caption { font-size: 12px; color: var(--muted); margin: 0 0 10px; }
  #json { min-height: 420px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; line-height: 1.45; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }

  /* the participant's journey */
  .legend { display: flex; flex-wrap: wrap; gap: 12px; margin: 0 0 12px; }
  .legend .chip { border: 0; padding: 0; cursor: default; color: var(--muted); font-size: 11.5px; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .lanes { display: grid; gap: 14px; }
  .lane { min-width: 0; }
  .lh { font-size: 12.5px; margin-bottom: 6px; display: flex; justify-content: space-between; color: var(--muted); }
  .lh b { color: var(--fg); }
  .strip { display: flex; height: 10px; border-radius: 4px; overflow: hidden; margin-bottom: 10px; gap: 1px; }
  .strip i { display: block; min-width: 2px; }
  .phase { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); margin: 12px 0 5px; }
  .fs { border-left: 3px solid; padding: 4px 9px; margin: 3px 0; font-size: 12.5px; background: var(--panel); border-radius: 0 7px 7px 0; }
  .fs span { color: var(--muted); }
  .fb { border-left: 5px solid; background: var(--panel); border-radius: 0 9px 9px 0; padding: 7px 11px; margin: 4px 0; font-size: 12.5px; }
  .fb .muted { font-size: 12px; }
  .fb.click { cursor: pointer; }
  .fb.click:hover { background: var(--panel2); }
  .fh { display: flex; justify-content: space-between; gap: 8px; }
  .thumbs { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
  .thumbs img { height: 34px; border-radius: 3px; border: 1px solid var(--border); }
  .thumbs .vid { height: 34px; width: 48px; display: inline-flex; align-items: center; justify-content: center;
    background: #2a2f37; border-radius: 3px; color: var(--muted); }

  /* ---- narrower screens ---- */
  @media (max-width: 1280px) {
    main { grid-template-columns: minmax(0, 1fr) minmax(360px, .85fr); }
    #rail { display: none; }
  }
  @media (max-width: 900px) {
    html, body { height: auto; }
    main { display: block; }
    #form, #side { overflow: visible; }
    #form { padding: 14px 16px 30px; }
    #side { border-left: 0; border-top: 1px solid var(--border); padding: 18px 16px 60px; }
    .opts.two, .grid2, .grid3, .palette, .epoch .grid4 { grid-template-columns: minmax(0, 1fr); }
    .epoch .span2 { grid-column: auto; }
    .tbody { padding-left: 14px; }
    .open select { min-width: 0; }
    #btnSave .mono { display: none; }
    header.top { gap: 10px 14px; }
  }
  @media (max-width: 520px) { .tdur { display: none; } }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="./index.html"><i></i>Researcher</a>
  <nav class="pages"><a href="./index.html">Sessions</a><a href="./cohort.html">Cohort</a><a href="./builder.html" aria-current="page">Study builder</a><a href="./codebook.html">Codebooks</a><a href="./annotate.html">Annotate</a></nav>
  <label class="open">Open <select id="startFrom"></select></label>
  <div class="spacer"></div>
  <span id="dirty" class="dirty" hidden>Unsaved changes</span>
  <span id="statusSlot"></span>
  <button class="primary" id="btnSave" disabled>Save</button>
</header>
<div id="saveResult" class="banner" hidden></div>
<main>
  <nav id="rail" aria-label="Sections"></nav>
  <div id="form"></div>
  <aside id="side"></aside>
</main>
<script type="module" src="./builder.js"></script>
</body>
</html>
