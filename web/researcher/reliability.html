<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reliability</title>
<link rel="stylesheet" href="./site.css">
<style>
  .toolbar { display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap; padding: 12px 24px;
    border-bottom: 1px solid var(--border); }
  .toolbar label { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
  .toolbar select { min-width: 240px; }
  main { padding: 22px 24px 60px; max-width: 1240px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600;
    margin: 28px 0 10px; padding-top: 16px; border-top: 1px solid var(--border); }
  h2:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
  h2 + .sub { color: var(--muted); font-size: 12.5px; margin: -4px 0 12px; max-width: 90ch; }
  td.num { font-family: var(--mono); font-size: 12.5px; white-space: nowrap; }
  td .why { color: var(--muted); font-size: 12px; }
  td .refused { color: #e3c27a; font-size: 12px; }
  .bar { height: 6px; background: var(--panel3); border-radius: 3px; overflow: hidden; margin-top: 4px; width: 120px; }
  .bar i { display: block; height: 100%; background: var(--ok); }
  .editor { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, .8fr); gap: 16px; }
  #ruleJson { width: 100%; min-height: 300px; font-family: var(--mono); font-size: 12px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--r); padding: 12px 14px; font-size: 13px; }
  .panel ul { margin: 6px 0 0; padding-left: 18px; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  @media (max-width: 900px) { .editor { grid-template-columns: minmax(0, 1fr); } .toolbar, main { padding-left: 16px; padding-right: 16px; } }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="./index.html"><i></i>Researcher</a>
  <nav class="pages"><a href="./index.html">Sessions</a><a href="./cohort.html">Cohort</a><a href="./builder.html">Study builder</a><a href="./codebook.html">Codebooks</a><a href="./annotate.html">Annotate</a><a href="./reliability.html" aria-current="page">Reliability</a></nav>
</header>
<div class="toolbar">
  <label>Codebook <select id="cb"></select></label>
  <label>Scoring rule <select id="rule"></select></label>
  <label>Agreement <select id="use"><option value="raw">raw agreement</option><option value="kappa">Cohen's kappa</option></select></label>
</div>
<main id="main"><div class="note">Choose a codebook.</div></main>
<script type="module" src="./reliability.js"></script>
</body>
</html>
