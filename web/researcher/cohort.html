<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cohort</title>
<style>
  :root {
    --bg: #101216; --fg: #e8eaed; --muted: #9aa0a6; --accent: #4c8dff;
    --ok: #5cb85c; --warn: #e0a800; --bad: #d9534f;
    --panel: #181b21; --border: #262a31;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 14px 20px; border-bottom: 1px solid var(--border);
           display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header a { color: var(--accent); font-size: 12px; }
  select, label { font: inherit; font-size: 12px; color: var(--fg); }
  select { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 5px 9px; }
  main { padding: 20px 24px; max-width: 1200px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .07em;
       color: var(--muted); margin: 26px 0 10px; font-weight: 600; }
  .hash { color: var(--muted); font-size: 12px; font-family: ui-monospace, Menlo, Consolas, monospace; }
  table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  th { text-align: left; color: var(--muted); font-weight: 600; padding: 6px 10px;
       border-bottom: 1px solid var(--border); font-size: 11px; text-transform: uppercase; }
  td { padding: 5px 10px; border-bottom: 1px solid #1c2027; vertical-align: top; }
  td.n { font-family: ui-monospace, Menlo, Consolas, monospace; width: 70px; }
  .why { color: var(--muted); font-size: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
  .panel .t { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .note { font-size: 12.5px; color: var(--muted); border-left: 2px solid var(--border);
          padding: 2px 0 2px 12px; margin: 10px 0; }
  .warn { color: var(--warn); }
  canvas { width: 100%; image-rendering: pixelated; border-radius: 4px; }
</style>
</head>
<body>
<header>
  <h1>Cohort</h1>
  <select id="study"></select>
  <label><input type="checkbox" id="dev"> include self-tests</label>
  <label><input type="checkbox" id="mixed"> include edited protocols</label>
  <a href="./index.html">sessions</a>
</header>
<main id="main"><div class="note">Choose a study.</div></main>
<script type="module" src="./cohort.js"></script>
</body>
</html>
