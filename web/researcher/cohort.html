<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cohort</title>
<link rel="stylesheet" href="./site.css">
<style>
  .toolbar { display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap; padding: 12px 24px;
    border-bottom: 1px solid var(--border); }
  .toolbar .study { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
  .toolbar select { min-width: 220px; }
  main { padding: 22px 24px 60px; max-width: 1240px; }
  .hash { color: var(--muted); font-size: 12px; font-family: var(--mono); }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600;
    margin: 30px 0 12px; padding-top: 18px; border-top: 1px solid var(--border); }
  h2 + .sub { color: var(--muted); font-size: 12.5px; margin: -6px 0 12px; }

  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 14px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: var(--r); padding: 12px 14px; }
  .stat .k { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  .stat .v { font-size: 24px; font-family: var(--mono); font-weight: 500; margin-top: 3px; }
  .stat.ok .v { color: var(--ok); } .stat.bad .v { color: var(--bad); }

  /* the funnel: how many remain after each step, and who each step removed */
  .funnel { display: grid; gap: 6px; }
  .fstep { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; align-items: start;
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--r); padding: 9px 12px; }
  .fstep .n { font-family: var(--mono); font-size: 16px; text-align: right; }
  .fstep .lbl { font-size: 13px; font-weight: 400; margin: 0; color: var(--fg); }
  .bar { height: 6px; background: var(--panel3); border-radius: 3px; margin-top: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
  .fstep.cut .bar i { background: var(--warn); }
  .out { margin-top: 6px; font-size: 12px; color: #e3c27a; }
  .out a { color: inherit; font-family: var(--mono); }
  .out span { color: var(--muted); }

  .contrast { margin-bottom: 14px; }
  table.res { margin: 8px 0 4px; }
  table.res th { position: static; background: none; }
  table.res td { font-family: var(--mono); font-size: 12.5px; }
  svg.arms { display: block; margin: 8px 0 2px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--r); padding: 12px 14px; }
  .panel .t { font-size: 13px; font-weight: 600; }
  .panel .m { font-size: 12px; color: var(--muted); margin: 1px 0 8px; }
  .heat { position: relative; border-radius: 6px; overflow: hidden; background: #000; }
  .heat img { display: block; width: 100%; filter: saturate(.55) brightness(.8); }
  .heat.video { aspect-ratio: 16 / 9; }
  .heat canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .ramp { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--muted); margin: 0 0 12px; }
  .ramp i { width: 120px; height: 8px; border-radius: 4px;
    background: linear-gradient(90deg, rgba(64,0,90,.3), #b0106a, #f06020, #ffd23a); }
  @media (max-width: 700px) { .toolbar, main { padding-left: 16px; padding-right: 16px; } .grid { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="./index.html"><i></i>Researcher</a>
  <nav class="pages"><a href="./index.html">Sessions</a><a href="./cohort.html" aria-current="page">Cohort</a><a href="./builder.html">Study builder</a><a href="./codebook.html">Codebooks</a><a href="./annotate.html">Annotate</a><a href="./reliability.html">Reliability</a></nav>
</header>
<div class="toolbar">
  <label class="study">Study <select id="study"></select></label>
  <label class="toggle"><input type="checkbox" id="dev"> Include self-tests</label>
  <label class="toggle"><input type="checkbox" id="mixed"> Include edited protocols</label>
</div>
<style>
  .scrollx { overflow-x: auto; }
  table.perstim { width: 100%; }
  table.perstim td, table.perstim th { white-space: nowrap; }
  .small { font-size: 11.5px; }
</style>
<main id="main"><div class="note">Choose a study.</div></main>
<script type="module" src="./cohort.js"></script>
</body>
</html>
