<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codebooks</title>
<link rel="stylesheet" href="./site.css">
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(380px, .8fr); }
  #form { overflow-y: auto; padding: 18px 28px 120px; }
  #side { overflow-y: auto; border-left: 1px solid var(--border); background: var(--bg2); padding: 18px 22px 80px; }
  .formwrap { max-width: 760px; margin: 0 auto; }

  /* categories */
  .cats-edit { display: grid; gap: 10px; }
  .catc { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; align-items: start;
    border: 1px solid var(--border2); border-radius: var(--r); background: #13161b; padding: 10px 10px 12px 12px; }
  .catc.invalid { border-color: var(--bad); }
  .catc .k { width: 26px; height: 26px; border: 1px solid var(--border2); border-radius: 6px; display: grid; place-items: center;
    font-size: 12px; color: var(--muted); margin-top: 22px; }
  .catc .row2 { display: grid; grid-template-columns: minmax(0, 1fr) 170px; gap: 0 10px; }
  .catc .field { margin-bottom: 8px; }
  .catc .tools { display: flex; flex-direction: column; gap: 2px; margin-top: 18px; }
  .catc .cerr { font-size: 12.5px; color: #f0a09d; }

  /* moments */
  .msum { display: flex; gap: 8px 18px; flex-wrap: wrap; align-items: baseline; font-size: 13px; margin-bottom: 10px; }
  .msum b { font-size: 20px; font-family: var(--mono); font-weight: 500; }
  .mlist { display: flex; flex-wrap: wrap; gap: 5px; max-height: 220px; overflow-y: auto; padding: 2px; }
  .mchip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--border2); border-radius: 999px;
    padding: 1px 3px 1px 9px; font-family: var(--mono); font-size: 12px; background: #13161b; }
  .mchip i { font-style: normal; color: var(--faint); font-size: 10.5px; }
  .mchip button { width: 20px; height: 20px; padding: 0; border: 0; background: transparent; color: var(--muted); border-radius: 50%; font-size: 11px; }
  .mchip button:hover:not(:disabled) { background: var(--panel3); color: var(--bad); border: 0; }
  .mtools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 12px 0 0; }
  .mtools label { display: inline-flex; align-items: center; gap: 6px; }
  #form .mtools input { width: 90px; padding: 5px 8px; font-size: 12.5px; }
  .adder { border: 1px solid var(--border2); border-radius: var(--r); margin-top: 16px; background: #13161b; }
  .adder .tabs { margin: 0; padding: 0 8px; }
  .adder .pane { padding: 14px; }
  .adder .inline { display: flex; gap: 8px 12px; align-items: flex-end; flex-wrap: wrap; }
  .adder .inline .field { margin: 0; width: 120px; }
  .adder .inline .field.wide { width: 100%; }
  .adder .why { font-size: 12px; color: var(--muted); margin: 0 0 12px; }
  .adder .said { font-size: 12.5px; margin-top: 10px; }
  .adder .said:empty { display: none; }
  .player video { width: 100%; max-height: 300px; background: #000; border-radius: 8px; display: block; }
  .timeline { position: relative; height: 16px; background: var(--panel3); border-radius: 4px; margin: 8px 0; cursor: pointer; }
  .timeline i { position: absolute; top: 2px; bottom: 2px; width: 2px; background: var(--warn); border-radius: 1px; }
  .timeline b { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); }

  /* the rater's screen, as annotate.html draws it */
  .rater { border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; background: var(--bg); }
  .rater .row { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--muted); }
  .rater .shot { background: #000; border-radius: 8px; height: 150px; display: grid; place-items: center;
    color: var(--muted); font-size: 12.5px; margin: 10px 0 0; text-align: center; padding: 10px; }
  .rater .shot b { color: var(--fg); font-family: var(--mono); font-size: 18px; display: block; }
  .step-row { display: flex; gap: 6px; align-items: center; margin-top: 10px; }
  .caption { font-size: 12px; color: var(--muted); margin: 0 0 10px; }
  table.versions td, table.versions th { font-size: 12px; }
  table.versions tr.cur td { background: #4c8dff14; }
  #json { width: 100%; min-height: 380px; font-family: var(--mono); font-size: 12px; }

  @media (max-width: 1000px) {
    html, body { height: auto; }
    main { display: block; }
    #form, #side { overflow: visible; }
    #form { padding: 14px 16px 30px; }
    #side { border-left: 0; border-top: 1px solid var(--border); padding: 18px 16px 60px; }
    .catc .row2, .grid2 { grid-template-columns: minmax(0, 1fr); }
    #btnSave .mono { display: none; }
  }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="./index.html"><i></i>Researcher</a>
  <nav class="pages"><a href="./index.html">Sessions</a><a href="./cohort.html">Cohort</a><a href="./builder.html">Study builder</a><a href="./codebook.html" aria-current="page">Codebooks</a><a href="./annotate.html">Annotate</a><a href="./reliability.html">Reliability</a></nav>
  <label class="open">Open <select id="openCb"></select></label>
  <div class="spacer"></div>
  <span id="dirty" class="dirty" hidden>Unsaved changes</span>
  <span id="statusSlot"></span>
  <button class="primary" id="btnSave" disabled>Save</button>
</header>
<div id="saveResult" class="banner" hidden></div>
<main>
  <div id="form"></div>
  <aside id="side"></aside>
</main>
<script type="module" src="./codebook.js"></script>
</body>
</html>
